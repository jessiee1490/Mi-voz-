<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Mi Voz</title>

  <meta name="theme-color" content="#087f6b">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Voz">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #087f6b;
      --dark: #204d36;
      --soft: #e4f4ea;
      --panel: #dff5ef;
      --routine: #fff5ce;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--dark);
      background: #f7faf9;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px;
      background: #d8f3e6;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 820px;
      margin: auto;
      padding: 14px;
    }

    .header-buttons {
      display: flex;
      gap: 7px;
    }

    .small-button {
      padding: 8px 12px;
      border: 2px solid var(--primary);
      border-radius: 11px;
      color: var(--primary);
      background: white;
      font-weight: bold;
    }

    #greeting,
    #question {
      text-align: center;
    }

    #greeting {
      min-height: 22px;
      margin: 5px 0;
      font-weight: bold;
    }

    #question {
      margin: 10px 0;
      font-size: 21px;
      font-weight: bold;
    }

    .mode-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
    }

    .mode-button {
      padding: 10px 14px;
      border: 1px solid var(--primary);
      border-radius: 18px;
      color: var(--primary);
      background: white;
      font-weight: bold;
    }

    .mode-button.active {
      color: white;
      background: var(--primary);
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 15px;
    }

    .category {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid #9acbbb;
      border-radius: 20px;
      color: var(--dark);
      background: white;
      font-weight: bold;
    }

    .category.active {
      color: white;
      background: var(--primary);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      position: relative;
      min-height: 128px;
      padding: 11px;

      border: 0;
      border-radius: 18px;

      color: var(--dark);
      background: var(--soft);
      box-shadow: 0 3px 8px #00000012;
    }

    .card:active {
      transform: scale(0.98);
    }

    .emoji {
      display: block;
      margin-bottom: 7px;
      font-size: 42px;
    }

    .card-text {
      display: block;
      font-size: 16px;
      font-weight: bold;
    }

    .routine-card {
      border: 2px solid #f0cf65;
      background: var(--routine);
    }

    .routine-card.done {
      border-color: #55ad80;
      background: #d8f3e6;
      opacity: 0.78;
    }

    .routine-card.done .card-text {
      text-decoration: line-through;
    }

    .routine-number {
      position: absolute;
      top: 8px;
      left: 8px;

      width: 28px;
      height: 28px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      color: white;
      background: var(--primary);
      font-weight: bold;
    }

    .routine-status {
      position: absolute;
      top: 7px;
      right: 8px;
      font-size: 25px;
    }

    #routinePanel {
      display: none;
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 16px;
      background: #fff8dc;
      text-align: center;
    }

    #routinePanel.visible {
      display: block;
    }

    #routineProgress {
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .progress-track {
      height: 16px;
      overflow: hidden;
      border-radius: 12px;
      background: #eadfb5;
    }

    #progressBar {
      width: 0;
      height: 100%;
      background: #30a46c;
      transition: width 0.25s;
    }

    .routine-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .message-box {
      margin-top: 16px;
      padding: 15px;
      border-radius: 18px;
      background: var(--panel);
      text-align: center;
    }

    #messageTitle {
      font-weight: bold;
    }

    #message {
      min-height: 42px;
      margin: 10px 0;
      font-size: 19px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .control {
      padding: 10px 13px;
      border: 1px solid var(--primary);
      border-radius: 12px;
      color: var(--primary);
      background: white;
      font-weight: bold;
    }

    .control.primary {
      color: white;
      background: var(--primary);
    }

    .danger {
      color: #a42121;
      border-color: #c85a5a;
    }

    .hidden {
      display: none !important;
    }

    #gamePanel {
      display: none;
      text-align: center;
    }

    #gamePanel.visible {
      display: block;
    }

    .game-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 14px;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 520px;
      margin: auto;
    }

    .memory-card {
      min-height: 105px;
      border: 2px solid #8dcfc3;
      border-radius: 16px;
      color: var(--dark);
      background: var(--panel);
      font-size: 40px;
      font-weight: bold;
    }

    .memory-card.matched {
      border-color: #55ad80;
      background: #d8f3e6;
    }

    dialog {
      width: min(94vw, 650px);
      max-height: 88vh;
      overflow: auto;

      padding: 0;
      border: 0;
      border-radius: 18px;

      color: var(--dark);
    }

    dialog::backdrop {
      background: #0008;
    }

    .modal {
      padding: 18px;
    }

    .field {
      margin: 12px 0;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .field input {
      width: 100%;
      padding: 11px;
      border: 1px solid #9acbbb;
      border-radius: 10px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .routine-editor {
      margin: 10px 0;
      padding: 11px;
      border: 1px solid #c7ddd5;
      border-radius: 14px;
    }

    .step-editor {
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 7px;

      margin: 8px 0;
      padding: 8px;

      border-radius: 10px;
      background: #f5faf8;
    }

    .step-editor .full {
      grid-column: 1 / -1;
    }

    .editor-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    button:focus,
    input:focus {
      outline: 4px solid #f1b24a;
      outline-offset: 2px;
    }

    @media (min-width: 650px) {
      #board {
        grid-template-columns: repeat(4, 1fr);
      }

      .memory-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mi Voz 💙</h1>

  <div class="header-buttons">
    <button id="settingsButton" class="small-button" type="button">
      ⚙️
    </button>

    <button id="languageButton" class="small-button" type="button">
      EN
    </button>
  </div>
</header>

<main>

  <p id="greeting"></p>
  <p id="question"></p>

  <div class="mode-buttons">
    <button id="quickModeButton" class="mode-button active" type="button">
      💬 Mensaje rápido
    </button>

    <button id="buildModeButton" class="mode-button" type="button">
      🧩 Construir frase
    </button>
  </div>

  <nav id="categories" class="categories"></nav>

  <section id="routinePanel">
    <div id="routineProgress"></div>

    <div class="progress-track">
      <div id="progressBar"></div>
    </div>

    <div class="routine-actions">
      <button id="resetRoutineButton" class="control" type="button">
        Reiniciar
      </button>

      <button id="editRoutineButton" class="control" type="button">
        ✏️ Editar rutina
      </button>
    </div>
  </section>

  <section id="board"></section>

  <section id="gamePanel">
    <h2>🧠 Memoria</h2>

    <div class="game-controls">
      <button class="control difficulty" data-pairs="3" type="button">
        Fácil
      </button>

      <button class="control difficulty" data-pairs="4" type="button">
        Medio
      </button>

      <button class="control difficulty" data-pairs="6" type="button">
        Avanzado
      </button>

      <button id="restartGameButton" class="control primary" type="button">
        🔄 Jugar otra vez
      </button>
    </div>

    <div id="memoryGrid" class="memory-grid"></div>
  </section>

  <section class="message-box">
    <div id="messageTitle">
      MI MENSAJE
    </div>

    <div id="message">
      Elige una imagen
    </div>

    <div class="controls">
      <button id="undoButton" class="control hidden" type="button">
        Deshacer
      </button>

      <button id="speakButton" class="control primary" type="button">
        🔊 Hablar
      </button>

      <button id="clearButton" class="control" type="button">
        Borrar
      </button>
    </div>
  </section>

</main>

<dialog id="profileDialog">
  <form id="profileForm" class="modal">
    <h2 id="profileTitle">Perfil</h2>

    <div class="field">
      <label id="childNameLabel" for="childName">
        Nombre del niño
      </label>

      <input
        id="childName"
        maxlength="30"
        autocomplete="off"
      >
    </div>

    <div class="modal-actions">
      <button id="cancelProfileButton" class="control" type="button">
        Cancelar
      </button>

      <button id="saveProfileButton" class="control primary" type="submit">
        Guardar
      </button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <div class="modal">
    <h2 id="settingsTitle">
      ⚙️ Personalizar Mi Voz
    </h2>

    <div class="controls">
      <button id="editNameButton" class="control" type="button">
        👤 Cambiar nombre
      </button>

      <button id="newRoutineButton" class="control primary" type="button">
        ➕ Nueva rutina
      </button>
    </div>

    <div id="routineEditors"></div>

    <div class="modal-actions">
      <button id="closeSettingsButton" class="control" type="button">
        Cerrar
      </button>
    </div>
  </div>
</dialog>

<dialog id="routineDialog">
  <form id="routineForm" class="modal">
    <h2 id="routineEditorTitle">
      ✏️ Editar rutina
    </h2>

    <input id="editingRoutineId" type="hidden">

    <div class="field">
      <label for="routineEmoji">Emoji</label>
      <input id="routineEmoji" maxlength="4" value="📅">
    </div>

    <div class="field">
      <label for="routineNameEs">Nombre en español</label>
      <input id="routineNameEs" maxlength="35">
    </div>

    <div class="field">
      <label for="routineNameEn">Nombre en inglés</label>
      <input id="routineNameEn" maxlength="35">
    </div>

    <h3 id="stepsTitle">Pasos</h3>

    <div id="stepsEditor"></div>

    <button id="addStepButton" class="control" type="button">
      ➕ Añadir paso
    </button>

    <div class="modal-actions">
      <button id="cancelRoutineButton" class="control" type="button">
        Cancelar
      </button>

      <button id="saveRoutineButton" class="control primary" type="submit">
        Guardar
      </button>
    </div>
  </form>
</dialog>

<script>
  const communication = {
    needs: {

      ],

      en: [

    feelings: {

        ["😢", "Estoy triste"],

        ["😴", "Estoy cansado"],

      ],

      en: [
        ["😊", "I am happy"],
        ["😢", "I am sad"],
        ["😡", "I am angry"],
        ["😟", "I am scared"],
        ["😴", "I am tired"],
        ["🤫", "I want quiet"],
        ["🤗", "I want a hug"],
        ["😣", "I feel unwell"]
      ]
    },

    activities: {
      es: [
        ["🎮", "Quiero jugar"],
        ["📚", "Quiero leer"],
        ["🎵", "Quiero música"],
        ["🏠", "Quiero ir a casa"],
        ["🚶", "Quiero caminar"],
        ["🛋️", "Quiero descansar"],
        ["👩", "Quiero a mamá"],
        ["👋", "Quiero saludar"]
      ],

      en: [
        ["🎮", "I want to play"],
        ["📚", "I want to read"],
        ["🎵", "I want music"],
        ["🏠", "I want to go home"],
        ["🚶", "I want to walk"],
        ["🛋️", "I want to rest"],
        ["👩", "I want my mom"],
        ["👋", "I want to say hello"]
      ]
    },

    choices: {
      es: [
        ["👍", "Sí"],
        ["👎", "No"],
        ["✋", "Espera"],
        ["🔁", "Otra vez"],
        ["🙅", "No quiero"],
        ["💬", "Quiero hablar"]
      ],

      en: [
        ["👍", "Yes"],
        ["👎", "No"],
        ["✋", "Wait"],
        ["🔁", "Again"],
        ["🙅", "I do not want to"],
        ["💬", "I want to talk"]
      ]
    }
  };

  const defaultRoutines = [
    {
      id: "morning",
      emoji: "🌅",
      nameEs: "Mañana",
      nameEn: "Morning",

      steps: [
        { emoji: "🌞", es: "Despertarme", en: "Wake up" },
        { emoji: "🚽", es: "Ir al baño", en: "Use the bathroom" },
        { emoji: "👕", es: "Vestirme", en: "Get dressed" },
        { emoji: "🥣", es: "Desayunar", en: "Eat breakfast" },
        { emoji: "🪥", es: "Cepillarme los dientes", en: "Brush my teeth" },
        { emoji: "🎒", es: "Prepararme para salir", en: "Get ready to go" }
      ]
    },

    {
      id: "school",
      emoji: "🎒",
      nameEs: "Escuela",
      nameEn: "School",

      steps: [
        { emoji: "🏫", es: "Llegar a la escuela", en: "Arrive at school" },
        { emoji: "🎒", es: "Guardar la mochila", en: "Put away my backpack" },
        { emoji: "🪑", es: "Sentarme", en: "Sit down" },
        { emoji: "✏️", es: "Trabajar", en: "Do my work" },
        { emoji: "🛝", es: "Ir al recreo", en: "Go to recess" },
        { emoji: "🏠", es: "Volver a casa", en: "Go home" }
      ]
    },

    {
      id: "meal",
      emoji: "🍽️",
      nameEs: "Comida",
      nameEn: "Mealtime",

      steps: [
        { emoji: "🧼", es: "Lavarme las manos", en: "Wash my hands" },
        { emoji: "🪑", es: "Sentarme", en: "Sit down" },
        { emoji: "🍽️", es: "Comer", en: "Eat" },
        { emoji: "🥤", es: "Beber", en: "Drink" },
        { emoji: "🧹", es: "Recoger", en: "Clean up" }
      ]
    },

    {
      id: "bath",
      emoji: "🛁",
      nameEs: "Baño",
      nameEn: "Bath",

      steps: [
        { emoji: "👕", es: "Preparar la ropa", en: "Prepare my clothes" },
        { emoji: "🛁", es: "Bañarme", en: "Take a bath" },
        { emoji: "🧻", es: "Secarme", en: "Dry off" },
        { emoji: "🧴", es: "Peinarme", en: "Brush my hair" },
        { emoji: "👚", es: "Vestirme", en: "Get dressed" }
      ]
    },

    {
      id: "night",
      emoji: "🌙",
      nameEs: "Noche",
      nameEn: "Night",

      steps: [
        { emoji: "🚽", es: "Ir al baño", en: "Go to the bathroom" },
        { emoji: "👕", es: "Ponerme el pijama", en: "Put on pajamas" },
        { emoji: "🪥", es: "Cepillarme los dientes", en: "Brush my teeth" },
        { emoji: "📖", es: "Leer un cuento", en: "Read a story" },
        { emoji: "🛏️", es: "Ir a la cama", en: "Go to bed" },
        { emoji: "😴", es: "Dormir", en: "Sleep" }
      ]
    }
  ];

  const categoryNames = {
    es: {
      needs: "Necesidades",
      feelings: "Emociones",
      activities: "Actividades",
      choices: "Sí / No"
    },

    en: {
      needs: "Needs",
      feelings: "Feelings",
      activities: "Activities",
      choices: "Yes / No"
    }
  };

  let language = "es";
  let category = "needs";
  let mode = "quick";
  let messageParts = [];

  let childName =
    localStorage.getItem("miVozChildName") || "";

  let routines;

  try {
    routines =
      JSON.parse(
        localStorage.getItem("miVozRoutines")
      ) || structuredClone(defaultRoutines);
  } catch {
    routines = structuredClone(defaultRoutines);
  }

  let selectedRoutine =
    routines[0]?.id || "morning";

  let completed = {};

  try {
    completed =
      JSON.parse(
        localStorage.getItem("miVozCompleted")
      ) || {};
  } catch {
    completed = {};
  }

  let memoryPairs = 3;
  let memoryDeck = [];
  let memoryOpen = [];
  let memoryLocked = false;

  const memorySymbols = [
    "🍎",
    "🐶",
    "🚗",
    "⭐",
    "🏠",
    "🌈",
    "🐸",
    "⚽"
  ];

  function speak(text) {
    if (!text || !("speechSynthesis" in window)) {
      return;
    }

    window.speechSynthesis.cancel();

    const voice =
      new SpeechSynthesisUtterance(text);

    voice.lang =
      language === "es"
        ? "es-US"
        : "en-US";

    voice.rate = 0.85;

    window.speechSynthesis.speak(voice);
  }

  function render() {
    document.documentElement.lang =
      language;

    document.getElementById(
      "languageButton"
    ).textContent =
      language === "es"
        ? "EN"
        : "ES";

    document.getElementById(
      "greeting"
    ).textContent =
      childName
        ? (
            language === "es"
              ? `Hola, ${childName} 👋`
              : `Hello, ${childName} 👋`
          )
        : "";

    document.getElementById(
      "quickModeButton"
    ).textContent =
      language === "es"
        ? "💬 Mensaje rápido"
        : "💬 Quick message";

    document.getElementById(
      "buildModeButton"
    ).textContent =
      language === "es"
        ? "🧩 Construir frase"
        : "🧩 Build a sentence";

    document
      .getElementById("quickModeButton")
      .classList.toggle(
        "active",
        mode === "quick"
      );

    document
      .getElementById("buildModeButton")
      .classList.toggle(
        "active",
        mode === "build"
      );

    renderCategories();

    if (category === "routine") {
      renderRoutine();
    } else if (category === "game") {
      renderGame();
    } else {
      renderCommunication();
    }

    updateMessage();
  }

  function renderCategories() {
    const container =
      document.getElementById(
        "categories"
      );

    container.innerHTML = "";

    Object.keys(communication)
      .forEach(key => {
        const button =
          document.createElement(
            "button"
          );

        button.className =
          "category" +
          (
            category === key
              ? " active"
              : ""
          );

        button.textContent =
          categoryNames[language][key];

        button.onclick = () => {
          category = key;
          render();
        };

        container.appendChild(button);
      });

    routines.forEach(routine => {
      const button =
        document.createElement(
          "button"
        );

      const selected =
        category === "routine" &&
        selectedRoutine === routine.id;

      button.className =
        "category" +
        (
          selected
            ? " active"
            : ""
        );

      button.textContent =
        routine.emoji +
        " " +
        (
          language === "es"
            ? routine.nameEs
            : routine.nameEn
        );

      button.onclick = () => {
        category = "routine";
        selectedRoutine = routine.id;
        render();
      };

      container.appendChild(button);
    });

    const gameButton =
      document.createElement("button");

    gameButton.className =
      "category" +
      (
        category === "game"
          ? " active"
          : ""
      );

    gameButton.textContent =
      language === "es"
        ? "🎮 Juegos"
        : "🎮 Games";

    gameButton.onclick = () => {
      category = "game";
      render();
    };

    container.appendChild(gameButton);
  }

  function renderCommunication() {
    const board =
      document.getElementById("board");

    board.innerHTML = "";
    board.classList.remove("hidden");

    document
      .getElementById("routinePanel")
      .classList.remove("visible");

    document
      .getElementById("gamePanel")
      .classList.remove("visible");

    document.getElementById(
      "question"
    ).textContent =
      language === "es"
        ? "¿Qué quieres comunicar?"
        : "What would you like to say?";

    communication[
      category
    ][
      language
    ].forEach(item => {
      const button =
        document.createElement(
          "button"
        );

      button.className = "card";

      button.innerHTML = `
        <span class="emoji">${item[0]}</span>
        <span class="card-text">${item[1]}</span>
      `;

      button.onclick =
        () => chooseMessage(item[1]);

      board.appendChild(button);
    });
  }

  function chooseMessage(text) {
    if (mode === "quick") {
      messageParts = [text];
    } else {
      messageParts.push(text);
    }

    updateMessage();
    speak(text);
  }

  function updateMessage() {
    const empty =
      language === "es"
        ? "Elige una imagen"
        : "Choose a picture";

    document.getElementById(
      "message"
    ).textContent =
      messageParts.length
        ? messageParts.join(" ")
        : empty;

    document
      .getElementById("undoButton")
      .classList.toggle(
        "hidden",
        mode !== "build"
      );
  }

  function getRoutine() {
    return routines.find(
      item =>
        item.id === selectedRoutine
    ) || routines[0];
  }

  function renderRoutine() {
    const routine = getRoutine();

    if (!routine) {
      return;
    }

    const board =
      document.getElementById("board");

    board.innerHTML = "";
    board.classList.remove("hidden");

    document
      .getElementById("gamePanel")
      .classList.remove("visible");

    document
      .getElementById("routinePanel")
      .classList.add("visible");

    document.getElementById(
      "question"
    ).textContent =
      routine.emoji +
      " " +
      (
        language === "es"
          ? routine.nameEs
          : routine.nameEn
      );

    const done =
      completed[routine.id] || [];

    routine.steps.forEach(
      (step, index) => {
        const finished =
          done.includes(index);

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "card routine-card" +
          (
            finished
              ? " done"
              : ""
          );

        button.innerHTML = `
          <span class="routine-number">
            ${index + 1}
          </span>

          <span class="routine-status">
            ${finished ? "✅" : "⬜"}
          </span>

          <span class="emoji">
            ${step.emoji}
          </span>

          <span class="card-text">
            ${
              language === "es"
                ? step.es
                : step.en
            }
          </span>
        `;

        button.onclick =
          () => toggleRoutineStep(index);

        board.appendChild(button);
      });

    updateProgress();
  }

  function toggleRoutineStep(index) {
    const routine = getRoutine();

    const done =
      completed[routine.id] || [];

    const position =
      done.indexOf(index);

    const step =
      routine.steps[index];

    if (position === -1) {
      done.push(index);

      speak(
        language === "es"
          ? step.es
          : step.en
      );
    } else {
      done.splice(position, 1);
    }

    completed[routine.id] = done;

    localStorage.setItem(
      "miVozCompleted",
      JSON.stringify(completed)
    );

    renderRoutine();

    if (
      done.length ===
      routine.steps.length
    ) {
      const completedText =
        language === "es"
          ? "Rutina completada"
          : "Routine completed";

      speak(
        childName
          ? `${childName}, ${completedText}`
          : completedText
      );
    }
  }

  function updateProgress() {
    const routine = getRoutine();

    const done =
      completed[routine.id] || [];

    const total =
      routine.steps.length;

    const percentage =
      total
        ? done.length / total * 100
        : 0;

    document.getElementById(
      "routineProgress"
    ).textContent =
      language === "es"
        ? `${done.length} de ${total} completados`
        : `${done.length} of ${total} completed`;

    document.getElementById(
      "progressBar"
    ).style.width =
      percentage + "%";
  }

  function resetRoutine() {
    const routine = getRoutine();

    completed[routine.id] = [];

    localStorage.setItem(
      "miVozCompleted",
      JSON.stringify(completed)
    );

    renderRoutine();

    speak(
      language === "es"
        ? "Rutina reiniciada"
        : "Routine reset"
    );
  }

  function shuffle(items) {
    for (
      let index = items.length - 1;
      index > 0;
      index--
    ) {
      const random =
        Math.floor(
          Math.random() *
          (index + 1)
        );

      [
        items[index],
        items[random]
      ] = [
        items[random],
        items[index]
      ];
    }

    return items;
  }

  function startMemory(pairs = memoryPairs) {
    memoryPairs = pairs;
    memoryOpen = [];
    memoryLocked = false;

    const symbols =
      memorySymbols.slice(0, pairs);

    memoryDeck =
      shuffle(
        [
          ...symbols,
          ...symbols
        ].map((symbol, index) => ({
          id: index,
          symbol,
          open: false,
          matched: false
        }))
      );

    drawMemory();
  }

  function renderGame() {
    document
      .getElementById("routinePanel")
      .classList.remove("visible");

    document
      .getElementById("board")
      .classList.add("hidden");

    document
      .getElementById("gamePanel")
      .classList.add("visible");

    document.getElementById(
      "question"
    ).textContent =
      language === "es"
        ? "🎮 Juego de memoria"
        : "🎮 Memory game";

    document.getElementById(
      "restartGameButton"
    ).textContent =
      language === "es"
        ? "🔄 Jugar otra vez"
        : "🔄 Play again";

    startMemory(memoryPairs);
  }

  function drawMemory() {
    const grid =
      document.getElementById(
        "memoryGrid"
      );

    grid.innerHTML = "";

    memoryDeck.forEach(
      (card, index) => {
        const button =
          document.createElement(
            "button"
          );

        button.className =
          "memory-card" +
          (
            card.matched
              ? " matched"
              : ""
          );

        button.textContent =
          card.open || card.matched
            ? card.symbol
            : "?";

        button.onclick =
          () => flipMemory(index);

        grid.appendChild(button);
      });
  }

  function flipMemory(index) {
    const card =
      memoryDeck[index];

    if (
      memoryLocked ||
      card.open ||
      card.matched
    ) {
      return;
    }

    card.open = true;
    memoryOpen.push(index);

    drawMemory();

    if (memoryOpen.length !== 2) {
      return;
    }

    const firstIndex =
      memoryOpen[0];

    const secondIndex =
      memoryOpen[1];

    const first =
      memoryDeck[firstIndex];

    const second =
      memoryDeck[secondIndex];

    if (
      first.symbol ===
      second.symbol
    ) {
      first.matched = true;
      second.matched = true;
      memoryOpen = [];

      speak(
        language === "es"
          ? "¡Muy bien!"
          : "Well done!"
      );

      drawMemory();

      if (
        memoryDeck.every(
          item => item.matched
        )
      ) {
        const text =
          language === "es"
            ? "Juego completado"
            : "Game completed";

        speak(
          childName
            ? `${childName}, ${text}`
            : text
        );
      }
    } else {
      memoryLocked = true;

      setTimeout(() => {
        first.open = false;
        second.open = false;
        memoryOpen = [];
        memoryLocked = false;

        drawMemory();
      }, 900);
    }
  }

  function openProfile() {
    document.getElementById(
      "childName"
    ).value = childName;

    document.getElementById(
      "profileDialog"
    ).showModal();
  }

  function saveProfile(event) {
    event.preventDefault();

    childName =
      document.getElementById(
        "childName"
      ).value.trim();

    localStorage.setItem(
      "miVozChildName",
      childName
    );

    document.getElementById(
      "profileDialog"
    ).close();

    render();

    if (childName) {
      speak(
        language === "es"
          ? `Hola, ${childName}`
          : `Hello, ${childName}`
      );
    }
  }

  function openSettings() {
    const area =
      document.getElementById(
        "routineEditors"
      );

    area.innerHTML = "";

    routines.forEach(routine => {
      const box =
        document.createElement(
          "div"
        );

      box.className =
        "routine-editor";

      box.innerHTML = `
        <h3>
          ${routine.emoji}
          ${
            language === "es"
              ? routine.nameEs
              : routine.nameEn
          }
        </h3>

        <div class="editor-buttons">
          <button
            class="control editRoutine"
            data-id="${routine.id}"
            type="button"
          >
            ✏️ Editar
          </button>

          <button
            class="control danger deleteRoutine"
            data-id="${routine.id}"
            type="button"
          >
            Eliminar
          </button>
        </div>
      `;

      area.appendChild(box);
    });

    area.querySelectorAll(
      ".editRoutine"
    ).forEach(button => {
      button.onclick =
        () =>
          openRoutineEditor(
            button.dataset.id
          );
    });

    area.querySelectorAll(
      ".deleteRoutine"
    ).forEach(button => {
      button.onclick =
        () =>
          deleteRoutine(
            button.dataset.id
          );
    });

    document.getElementById(
      "settingsDialog"
    ).showModal();
  }

  function openRoutineEditor(id = "") {
    const routine =
      routines.find(
        item => item.id === id
      );

    document.getElementById(
      "editingRoutineId"
    ).value =
      routine ? routine.id : "";

    document.getElementById(
      "routineEmoji"
    ).value =
      routine ? routine.emoji : "📅";

    document.getElementById(
      "routineNameEs"
    ).value =
      routine ? routine.nameEs : "";

    document.getElementById(
      "routineNameEn"
    ).value =
      routine ? routine.nameEn : "";

    const editor =
      document.getElementById(
        "stepsEditor"
      );

    editor.innerHTML = "";

    const steps =
      routine
        ? routine.steps
        : [
            {
              emoji: "⭐",
              es: "",
              en: ""
            }
          ];

    steps.forEach(addStepEditor);

    document.getElementById(
      "settingsDialog"
    ).close();

    document.getElementById(
      "routineDialog"
    ).showModal();
  }

  function addStepEditor(
    step = {
      emoji: "⭐",
      es: "",
      en: ""
    }
  ) {
    const editor =
      document.getElementById(
        "stepsEditor"
      );

    const box =
      document.createElement(
        "div"
      );

    box.className =
      "step-editor";

    box.innerHTML = `
      <input
        class="stepEmoji"
        maxlength="4"
        value="${step.emoji}"
      >

      <input
        class="stepEs"
        placeholder="Paso en español"
        value="${step.es}"
      >

      <input
        class="stepEn full"
        placeholder="Step in English"
        value="${step.en}"
      >

      <div class="editor-buttons full">
        <button class="control up" type="button">
          ↑
        </button>

        <button class="control down" type="button">
          ↓
        </button>

        <button class="control danger removeStep" type="button">
          Eliminar
        </button>
      </div>
    `;

    box.querySelector(
      ".up"
    ).onclick = () => {
      if (
        box.previousElementSibling
      ) {
        editor.insertBefore(
          box,
          box.previousElementSibling
        );
      }
    };

    box.querySelector(
      ".down"
    ).onclick = () => {
      if (
        box.nextElementSibling
      ) {
        editor.insertBefore(
          box.nextElementSibling,
          box
        );
      }
    };

    box.querySelector(
      ".removeStep"
    ).onclick =
      () => box.remove();

    editor.appendChild(box);
  }

  function saveRoutine(event) {
    event.preventDefault();

    const oldId =
      document.getElementById(
        "editingRoutineId"
      ).value;

    const id =
      oldId ||
      "routine-" + Date.now();

    const steps =
      Array.from(
        document.getElementById(
          "stepsEditor"
        ).children
      ).map(box => ({
        emoji:
          box.querySelector(
            ".stepEmoji"
          ).value || "⭐",

        es:
          box.querySelector(
            ".stepEs"
          ).value || "Paso",

        en:
          box.querySelector(
            ".stepEn"
          ).value || "Step"
      }));

    const routine = {
      id,

      emoji:
        document.getElementById(
          "routineEmoji"
        ).value || "📅",

      nameEs:
        document.getElementById(
          "routineNameEs"
        ).value || "Mi rutina",

      nameEn:
        document.getElementById(
          "routineNameEn"
        ).value || "My routine",

      steps
    };

    const index =
      routines.findIndex(
        item => item.id === id
      );

    if (index >= 0) {
      routines[index] = routine;
    } else {
      routines.push(routine);
    }

    localStorage.setItem(
      "miVozRoutines",
      JSON.stringify(routines)
    );

    selectedRoutine = id;
    category = "routine";

    document.getElementById(
      "routineDialog"
    ).close();

    render();
  }

  function deleteRoutine(id) {
    if (routines.length <= 1) {
      return;
    }

    routines =
      routines.filter(
        item => item.id !== id
      );

    delete completed[id];

    selectedRoutine =
      routines[0].id;

    localStorage.setItem(
      "miVozRoutines",
      JSON.stringify(routines)
    );

    localStorage.setItem(
      "miVozCompleted",
      JSON.stringify(completed)
    );

    openSettings();
    render();
  }

  document.getElementById(
    "languageButton"
  ).onclick = () => {
    language =
      language === "es"
        ? "en"
        : "es";

    messageParts = [];

    render();
  };

  document.getElementById(
    "quickModeButton"
  ).onclick = () => {
    mode = "quick";

    if (messageParts.length > 1) {
      messageParts = [
        messageParts[
          messageParts.length - 1
        ]
      ];
    }

    render();
  };

  document.getElementById(
    "buildModeButton"
  ).onclick = () => {
    mode = "build";
    render();
  };

  document.getElementById(
    "undoButton"
  ).onclick = () => {
    messageParts.pop();
    updateMessage();
  };

  document.getElementById(
    "speakButton"
  ).onclick = () => {
    speak(
      messageParts.join(" ")
    );
  };

  document.getElementById(
    "clearButton"
  ).onclick = () => {
    messageParts = [];
    updateMessage();
  };

  document.getElementById(
    "resetRoutineButton"
  ).onclick = resetRoutine;

  document.getElementById(
    "editRoutineButton"
  ).onclick = () => {
    openRoutineEditor(
      selectedRoutine
    );
  };

  document.getElementById(
    "settingsButton"
  ).onclick = openSettings;

  document.getElementById(
    "editNameButton"
  ).onclick = () => {
    document.getElementById(
      "settingsDialog"
    ).close();

    openProfile();
  };

  document.getElementById(
    "newRoutineButton"
  ).onclick = () => {
    document.getElementById(
      "settingsDialog"
    ).close();

    openRoutineEditor();
  };

  document.getElementById(
    "closeSettingsButton"
  ).onclick = () => {
    document.getElementById(
      "settingsDialog"
    ).close();
  };

  document.getElementById(
    "cancelProfileButton"
  ).onclick = () => {
    document.getElementById(
      "profileDialog"
    ).close();
  };

  document.getElementById(
    "cancelRoutineButton"
  ).onclick = () => {
    document.getElementById(
      "routineDialog"
    ).close();
  };

  document.getElementById(
    "addStepButton"
  ).onclick = () => {
    addStepEditor();
  };

  document.getElementById(
    "profileForm"
  ).onsubmit = saveProfile;

  document.getElementById(
    "routineForm"
  ).onsubmit = saveRoutine;

  document.querySelectorAll(
    ".difficulty"
  ).forEach(button => {
    button.onclick = () => {
      startMemory(
        Number(
          button.dataset.pairs
        )
      );
    };
  });

  document.getElementById(
    "restartGameButton"
  ).onclick = () => {
    startMemory(memoryPairs);
  };

  render();

  if (!childName) {
    setTimeout(
      openProfile,
      300
    );
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener(
      "load",
      () => {
        navigator
          .serviceWorker
          .register(
            "service-worker.js"
          )
          .catch(() => {});
      }
    );
  }
</script>

</body>
</html>
